    <style>
        :root {
            --oro: #d4af37;
            --oro-brillo: #f0cf65;
            --oro-suave: rgba(212, 175, 55, 0.14);
            --fondo-app: #080808;
            --tarjeta-bg: #121212;
            --tarjeta-elevada: #181818;
            --borde-sutil: rgba(212, 175, 55, 0.22);
            --texto-principal: #f7f5f0;
            --texto-silenciado: #a6a095;
            --ocupado-bg: rgba(165, 32, 32, 0.25);
            --ocupado-borde: rgba(239, 68, 68, 0.65);
            --libre-texto: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #17140b 0%, var(--fondo-app) 55%);
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1060px;
        }

        /* Encabezado superior */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 18px;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--borde-sutil);
        }

        .brand-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.1rem;
            color: var(--oro);
            letter-spacing: 0.5px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--texto-silenciado);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--tarjeta-bg);
            border: 1px solid var(--borde-sutil);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.82rem;
            color: var(--oro-brillo);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        /* Estructura en columnas */
        .layout-grid {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 24px;
        }

        @media (max-width: 840px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--tarjeta-bg);
            border: 1px solid var(--borde-sutil);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        }

        /* Cabecera y controles del calendario */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .calendar-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--oro);
            margin: 0;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select, input, textarea {
            background: var(--tarjeta-elevada);
            color: var(--texto-principal);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 9px 12px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--oro);
            outline: none;
        }
